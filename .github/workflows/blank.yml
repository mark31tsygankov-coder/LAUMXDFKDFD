
name: Build Windows Launcher

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build standalone EXE
        shell: pwsh
        run: |
          dotnet publish .\OMNIRO.ONLINE.Launcher\OMNIRO.ONLINE.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OMNIRO-ONLINE-Launcher-Windows-x64
          path: OMNIRO.ONLINE.Launcher\bin\Release\net8.0-windows\win-x64\publish\*.exe
          if-no-files-found: error
